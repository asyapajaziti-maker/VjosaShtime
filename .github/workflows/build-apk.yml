name: Build Vjosa Shtime APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VjosaShtime.apk

      - name: Publish direct APK link
        run: |
          mkdir -p download
          cp VjosaShtime.apk download/VjosaShtime.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/VjosaShtime.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest APK for Fire TV"
            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VjosaShtime-APK
          path: VjosaShtime.apk
          retention-days: 30
